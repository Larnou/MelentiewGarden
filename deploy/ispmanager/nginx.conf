# Страница обслуживания. Вставить целиком в ISPmanager:
# Сайты → саженцы-иркутск.рф → Изменить → Дополнительные директивы nginx.
# Фрагмент должен оказаться внутри server { }, не внутри location.
#
# Режим включён, пока в корне сайта лежит maintenance.on.
# Выключить для всех: удалить maintenance.on. Перезапуск nginx не нужен.
# Новый IP: строка в maintenance-allowlist.txt (её читает PHP по REMOTE_ADDR).
# Если после этого новый IP всё ещё видит заглушку, добавьте рядом такую же
# проверку $remote_addr, как для адреса ниже, и сохраните сайт в панели.
# Заголовки прокси не читаются.

set $mg_pass 0;
if ($remote_addr = "91.132.224.222") {
    set $mg_pass 1;
}

set $mg_maint "";
if (-f $document_root/maintenance.on) {
    set $mg_maint M;
}
if ($uri = /maintenance.php) {
    set $mg_maint "${mg_maint}S";
}
if ($uri ~ ^/\.well-known/) {
    set $mg_maint "${mg_maint}W";
}
if ($mg_pass = 1) {
    set $mg_maint "";
}
if ($mg_maint = "M") {
    rewrite ^ /maintenance.php last;
}

location = /maintenance-allowlist.txt {
    return 404;
}
location = /maintenance.on {
    return 404;
}
